<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline Marswalk planner for the Gale Crater boxwork, built on NASA data." />
    <title>Boxwork EVA Navigator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308111f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232fd4f0' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffb020'/%3E%3C/svg%3E"
