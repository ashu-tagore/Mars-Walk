<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline Marswalk planner for the Gale Crater boxwork, built on NASA data." />
    <title>Boxwork EVA Navigator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317171c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f4f3ef' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff7759'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header id="header" class="app-header"></header>
      <main class="map-area">
        <div id="map" class="map" aria-label="Site map"></div>
        <div class="map-tools">
          <div class="map-layers">
            <button id="layers-toggle" class="mw-btn mw-btn-outline floating" type="button" aria-expanded="false" aria-controls="left-panel">Layers</button>
            <aside id="left-panel" class="layer-menu" aria-label="Data layers" hidden></aside>
          </div>
          <div id="modes" class="mode-switch" role="group" aria-label="What a map click sets"></div>
        </div>
        <aside id="right-panel" class="drawer" aria-label="Mission panel"></aside>
        <section id="profile" class="profile-sheet" aria-label="Route profile" hidden></section>
        <div id="dock" class="dock" aria-label="EVA status"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
